<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Magic Builder — fetta verticale</title>
<style>
  :root{
    --bg:#080B0D; --panel:#10161A; --line:#1E282E; --ink:#DCE6EA; --muted:#7E9199;
    --fuoco:#F0774C; --acqua:#57B6DC; --terra:#D0A04A; --vento:#82C4A8;
    --ok:#7FCCA4; --warn:#E0A85C; --bad:#EE8A72;
    --mat:var(--fuoco);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font:13px/1.45 ui-sans-serif,system-ui,-apple-system,sans-serif;overscroll-behavior:none}
  #app{display:flex;height:100%;width:100%}
  #arena{position:relative;flex:1 1 auto;min-width:0;touch-action:none}
  canvas{display:block;width:100%;height:100%}

  #hud{position:absolute;inset:0;pointer-events:none}
  #fps{position:absolute;top:8px;left:10px;font:11px/1.5 ui-monospace,monospace;color:var(--muted);
    background:rgba(8,11,13,.6);padding:4px 8px;border-radius:3px;white-space:pre}
  #verdict{position:absolute;top:8px;right:10px;font:11px/1.5 ui-monospace,monospace;
    padding:4px 9px;border-radius:99px;border:1px solid currentColor;opacity:0;transition:opacity .25s}
  #verdict.on{opacity:1}
  #origine{position:absolute;left:14%;bottom:calc(31% - 5px);width:10px;height:10px;margin:-5px 0 0 -5px;
    border-radius:50%;background:var(--mat);opacity:.55}
  #bersaglio{position:absolute;left:78%;bottom:calc(31% - 26px);width:52px;height:52px;margin:-26px 0 0 -26px;
    border:1px solid var(--line);border-radius:50%;display:grid;place-items:center}
  #bersaglio i{width:16px;height:16px;border:1px solid var(--line);border-radius:50%}
  #hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:var(--muted);
    font-size:11px;letter-spacing:.04em}

  #ring{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;pointer-events:none;opacity:0;
    transition:opacity .12s}
  #ring.on{opacity:1}
  #ring circle{fill:none;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}

  #panel{flex:0 0 296px;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden}
  #panel header{padding:10px 14px;border-bottom:1px solid var(--line)}
  #mats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  .mat{padding:7px 0;border:1px solid var(--line);background:transparent;color:var(--muted);
    border-radius:3px;font:600 11px/1 ui-sans-serif,system-ui,sans-serif;cursor:pointer}
  .mat[aria-pressed=true]{color:var(--bg);background:var(--c);border-color:var(--c)}
  .mat:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  #axes{flex:1 1 auto;overflow-y:auto;padding:4px 14px 10px}
  .ax{padding:7px 0 8px;border-bottom:1px solid var(--line)}
  .ax:last-child{border-bottom:0}
  .axhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .axname{font-size:11px;letter-spacing:.01em}
  .axname b{font-weight:600}
  .axval{font:11px/1 ui-monospace,monospace;color:var(--muted);font-variant-numeric:tabular-nums}
  .axval.set{color:var(--mat)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;
    margin:2px 0 0;display:block}
  input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line);border-radius:2px}
  input[type=range]::-moz-range-track{height:3px;background:var(--line);border-radius:2px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:var(--ink);margin-top:-6.5px;border:0}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:0}
  input[type=range]:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}

  #readout{border-top:1px solid var(--line);padding:9px 14px 12px;background:#0C1215}
  .rows{display:grid;grid-template-columns:auto auto;gap:2px 10px;font:11px/1.6 ui-monospace,monospace;
    font-variant-numeric:tabular-nums}
  .rows dt{color:var(--muted)} .rows dd{margin:0;text-align:right}
  #state{margin-top:8px;padding:5px 9px;border-radius:3px;font-size:11px;text-align:center;
    border:1px solid currentColor}
  .s-ok{color:var(--ok)} .s-warn{color:var(--warn)} .s-bad{color:var(--bad)}
  #mana{margin-top:9px;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
  #mana i{display:block;height:100%;width:100%;background:var(--acqua);transition:width .06s linear}
  #mana i.low{background:var(--bad)}

  @media (max-width:720px){ #panel{flex-basis:242px} }
</style>
</head>
<body>
<div id="app">
  <div id="arena">
    <canvas id="c"></canvas>
    <div id="hud">
      <div id="fps">—</div>
      <div id="verdict"></div>
      <svg id="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="44" stroke="#1E282E" stroke-width="4"></circle>
        <circle id="arc" cx="50" cy="50" r="44" stroke="currentColor" stroke-width="4"
                stroke-dasharray="276.5" stroke-dashoffset="276.5"></circle>
      </svg>
      <div id="origine"></div>
      <div id="bersaglio"><i></i></div>
      <div id="hint">tieni premuto nell'arena per evocare · rilascia prima e non parte</div>
    </div>
  </div>

  <aside id="panel">
    <header>
      <div id="mats" role="group" aria-label="Materia"></div>
    </header>
    <div id="axes"></div>
    <div id="readout">
      <dl class="rows">
        <dt>carico</dt><dd id="r-car">—</dd>
        <dt>evocazione</dt><dd id="r-tem">—</dd>
        <dt>mana</dt><dd id="r-man">—</dd>
        <dt>dose max pulita</dt><dd id="r-dos">—</dd>
      </dl>
      <div id="state" class="s-ok">pulita</div>
      <div id="mana"><i id="manabar"></i></div>
    </div>
  </aside>
</div>

<script>
"use strict";
/* ============================================================
   Magic Builder — fetta verticale (ticket 11)
   Un file, zero dipendenze, zero asset, script classico:
   i moduli ES non funzionano su file:// (ticket 02).
   ============================================================ */

/* ---------- modello (ticket 04 / 05) ---------- */
const BASE = 2, CTRL = 7, SERBATOIO = 100, DRENAGGIO = 30, RICARICA = 12;

const ASSI = [
  {k:'direzione',  et:'direzione',                 peso:3, bip:false, dir:true},
  {k:'radiale',    et:'convergenza ↔ dispersione', peso:2, bip:true},
  {k:'massa',      et:'forza ↔ cedevolezza',       peso:2, bip:true},
  {k:'vita',       et:'durata ↔ istantaneità',     peso:2, bip:true},
  {k:'rotazione',  et:'rotazione ↔ contro',        peso:2, bip:true},
  {k:'stabilita',  et:'stabilità',                 peso:1, bip:true},
  {k:'levitazione',et:'levitazione ↔ peso',        peso:1, bip:true},
  {k:'ritmo',      et:'ritmo',                     peso:1, bip:true}
];

const MATERIE = {
  fuoco:{col:[1.00,0.47,0.29], col2:[1.00,0.86,0.42], nome:'Fuoco',
    riposo:{radiale:-0.6, massa:-0.5, vita:-0.6, rotazione: 0.1, stabilita:0.0, levitazione: 0.7, ritmo: 0.8}},
  acqua:{col:[0.34,0.71,0.86], col2:[0.72,0.93,1.00], nome:'Acqua',
    riposo:{radiale: 0.2, massa:-0.3, vita: 0.6, rotazione: 0.6, stabilita:0.7, levitazione:-0.5, ritmo:-0.3}},
  terra:{col:[0.82,0.63,0.29], col2:[1.00,0.86,0.60], nome:'Terra',
    riposo:{radiale: 0.3, massa: 0.8, vita: 0.6, rotazione:-0.2, stabilita:0.9, levitazione:-0.8, ritmo: 0.0}},
  vento:{col:[0.51,0.77,0.66], col2:[0.85,1.00,0.94], nome:'Vento',
    riposo:{radiale:-0.7, massa:-0.8, vita:-0.2, rotazione: 0.7, stabilita:0.1, levitazione: 0.6, ritmo: 0.4}}
};

/* la formula: solo gli assi impostati; gli altri prendono il riposo della materia */
const formula = { materia:'fuoco', dose:1.0, assi:{} };

const riposoDi = (k) => (k === 'direzione' ? 0 : MATERIE[formula.materia].riposo[k]);
const valoreDi = (k) => (k in formula.assi ? formula.assi[k] : riposoDi(k));

function carico(){
  let c = BASE;
  for (const a of ASSI){
    if (!(a.k in formula.assi)) continue;          // i valori di riposo sono gratis
    c += a.peso * Math.abs(formula.assi[a.k] - riposoDi(a.k));
  }
  return c;
}
const tempoBase = (c) => (c*c)/40;
function stato(){
  const c = carico(), t = tempoBase(c)*formula.dose, m = t*DRENAGGIO;
  const nit = Math.min(CTRL/(c*formula.dose), 1);
  const doseMax = Math.min(CTRL/c, 2);
  let deg = 'pulita';
  if (nit < 0.75) deg = (nit < 0.45) ? 'inversione spontanea' : 'inversione spontanea';
  else if (nit < 0.999) deg = 'deriva';
  return {c, t, m, nit, doseMax, deg};
}

/* ---------- micro-renderer WebGL2 (ticket 02) ---------- */
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', {antialias:false, alpha:false, premultipliedAlpha:false,
  powerPreference:'high-performance', preserveDrawingBuffer:false});
if (!gl){ document.getElementById('hint').textContent = 'WebGL2 non disponibile su questo browser.'; }

const DPR_CAP = 1.5;                                  // ticket 03
let aspect = 1;
function resize(){
  const d = Math.min(devicePixelRatio || 1, DPR_CAP);
  const w = Math.round(canvas.clientWidth * d), h = Math.round(canvas.clientHeight * d);
  if (canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
  gl.viewport(0,0,canvas.width,canvas.height);
  aspect = canvas.width / Math.max(canvas.height,1);
}

function sh(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i=0;i<n;i++){ const info = gl.getActiveUniform(p,i);
    const nm = info.name.replace(/\[0\]$/,''); u[nm] = gl.getUniformLocation(p, nm); }
  return {p, u};
}

/* Un solo programma. La composizione entra come uniform, mai come codice: il ticket 03
   vieta di compilare shader a runtime, perche' su mobile e' uno stallo visibile. */
const VS = `#version 300 es
precision highp float;
in vec2 quad;        // -1..1
in vec3 seed;        // rand per particella
in float slot;       // indice normalizzato

uniform float uT;        // tempo dall'inizio dell'emissione
uniform float uLife;     // durata di vita base
uniform vec2  uDir;      // direzione (x,y) gia' ruotata
uniform float uSpeed;
uniform float uRadial;   // + converge, - disperde
uniform float uMass;     // + tiene la linea, - devia
uniform float uRot;      // momento angolare
uniform float uNoise;    // 1 - stabilita
uniform float uGrav;     // + fluttua, - cade
uniform float uBeat;     // ritmo: 0 continuo, 1 a raffiche
uniform float uCoher;    // nitidezza -> nitidezza del bordo
uniform float uSize;
uniform float uAspect;
uniform float uDrift;    // deriva: scarto dell'asse
uniform vec2  uOrigin;
out float vAge; out float vSeed; out float vSoft;

float h(float x){ return fract(sin(x*127.1)*43758.5453); }

void main(){
  // ritmo: a raffiche le particelle nascono a gruppi
  float grp = floor(slot*8.0);
  float birth = mix(slot, grp/8.0, uBeat) * uLife * 1.15;
  float age = (uT - birth) / max(uLife, 0.05);
  if (age < 0.0 || age > 1.0){ gl_Position = vec4(2.0,2.0,0.0,1.0); vAge=1.0; vSeed=0.0; vSoft=0.0; return; }

  float sp = uSpeed * mix(0.55, 1.0, uMass*0.5+0.5);
  vec2 dir = vec2(cos(uDrift)*uDir.x - sin(uDrift)*uDir.y,
                  sin(uDrift)*uDir.x + cos(uDrift)*uDir.y);
  vec2 perp = vec2(-dir.y, dir.x);

  // spread iniziale per particella
  float ang = seed.x * 6.2831853;
  float rad = (0.045 + seed.y*0.13);

  // radiale: converge verso l'asse o si apre
  float spread = rad * (1.0 - uRadial*age*1.2);
  vec2 off = perp*cos(ang)*spread + dir*sin(ang)*spread*0.25;

  // rotazione attorno all'asse
  float ra = uRot * age * 3.0;
  off = vec2(off.x*cos(ra) - off.y*sin(ra), off.x*sin(ra) + off.y*cos(ra));

  // cedevolezza: si lascia deviare progressivamente
  off += perp * (1.0 - clamp(uMass*0.5+0.5,0.0,1.0)) * sin(age*4.0 + seed.z*6.28) * 0.30 * age;

  vec2 pos = dir * sp * age + off;
  pos.y += uGrav * age * age * 0.9;                       // gravita'
  pos += (vec2(h(seed.z*13.0), h(seed.z*29.0)) - 0.5) * uNoise * 0.5 * age;

  float sz = uSize * (0.55 + 0.45*sin(age*3.14159)) * mix(1.0, 1.6, 1.0-uCoher);
  vec2 v = uOrigin + pos + quad * sz * vec2(1.0/uAspect, 1.0);
  gl_Position = vec4(v.x, v.y, 0.0, 1.0);
  vAge = age; vSeed = seed.z; vSoft = uCoher;
}`;

/* il fragment vero: cerchio morbido, bordo governato dalla coerenza */
const FS2 = `#version 300 es
precision mediump float;
in float vAge; in float vSeed; in float vSoft;
in vec2 vQuad;
uniform vec3 uCol; uniform vec3 uCol2; uniform float uAlpha;
out vec4 o;
void main(){
  float d = length(vQuad);
  float edge = mix(0.75, 0.05, vSoft);              // nitido = bordo netto
  float a = smoothstep(1.0, 1.0-edge-0.02, d);
  a *= (1.0 - vAge*vAge) * uAlpha;
  if (a <= 0.003) discard;
  vec3 c = mix(uCol2, uCol, clamp(vAge*1.4,0.0,1.0));
  o = vec4(c*a, a);                                  // premultiplicato, blend additivo
}`;

const VS2 = VS.replace('out float vAge; out float vSeed; out float vSoft;',
                       'out float vAge; out float vSeed; out float vSoft; out vec2 vQuad;')
              .replace('vAge = age; vSeed = seed.z; vSoft = uCoher;',
                       'vAge = age; vSeed = seed.z; vSoft = uCoher; vQuad = quad;');

let prog = null, vao = null, N = 2000;
function build(){
  prog = program(VS2, FS2);
  vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const quad = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
  const qb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, qb);
  gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);
  const lq = gl.getAttribLocation(prog.p,'quad');
  gl.enableVertexAttribArray(lq); gl.vertexAttribPointer(lq,2,gl.FLOAT,false,0,0);

  const seeds = new Float32Array(N*3), slots = new Float32Array(N);
  for (let i=0;i<N;i++){ seeds[i*3]=Math.random(); seeds[i*3+1]=Math.random(); seeds[i*3+2]=Math.random();
    slots[i]= i/N; }
  const sb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, sb);
  gl.bufferData(gl.ARRAY_BUFFER, seeds, gl.STATIC_DRAW);
  const ls = gl.getAttribLocation(prog.p,'seed');
  gl.enableVertexAttribArray(ls); gl.vertexAttribPointer(ls,3,gl.FLOAT,false,0,0); gl.vertexAttribDivisor(ls,1);

  const tb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, tb);
  gl.bufferData(gl.ARRAY_BUFFER, slots, gl.STATIC_DRAW);
  const lt = gl.getAttribLocation(prog.p,'slot');
  gl.enableVertexAttribArray(lt); gl.vertexAttribPointer(lt,1,gl.FLOAT,false,0,0); gl.vertexAttribDivisor(lt,1);
  gl.bindVertexArray(null);
}

/* ---------- stato di gioco ---------- */
let serbatoio = SERBATOIO;
let evocando = false, tEvoc = 0, tRichiesto = 0, manaIniziale = 0;
let volo = null;                    // {t0, params}
let ultimoVerdetto = 0;

function paramsDaFormula(nit, collasso){
  const M = MATERIE[formula.materia];
  const v = (k) => valoreDi(k);
  let radiale = v('radiale'), massa = v('massa'), rot = v('rotazione');
  // inversione spontanea: un asse semi-direzionale si ribalta
  if (nit < 0.75){
    const scelti = ['radiale','massa','rotazione'].filter(k => k in formula.assi);
    if (scelti.length){
      const k = scelti[Math.floor(Math.random()*scelti.length)];
      if (k==='radiale') radiale = -radiale; else if (k==='massa') massa = -massa; else rot = -rot;
    }
  }
  const vita = v('vita'), stab = v('stabilita'), lev = v('levitazione'), ritmo = v('ritmo');
  const dirV = v('direzione');
  // deriva: l'asse scarta, tanto piu' quanto e' lunga l'evocazione
  const deriva = (1 - Math.min(nit,1)) * tRichiesto * 0.55 * (Math.random()<0.5?-1:1);
  // il collasso implode sull'origine: non e' la spell al contrario, e' la spell che cede addosso
  return {
    life: collasso ? 0.55 : 0.45 + (vita*0.5+0.5)*1.6,
    dir: [Math.cos(0.20), Math.sin(0.20)],
    speed: collasso ? 0.12 : (0.18 + Math.abs(dirV)*1.85),
    radial: collasso ? 1.0 : radiale,
    mass: collasso ? -1.0 : massa,
    rot: collasso ? 1.6 : rot,
    noise: (1 - (stab*0.5+0.5)) * (collasso ? 2.2 : 1),
    grav: collasso ? -0.25 : lev*0.55, beat: collasso ? 0 : (ritmo*0.5+0.5),
    coher: collasso ? 0.15 : Math.min(nit,1),
    size: 0.013 * (0.75 + 0.45*formula.dose) * (collasso ? 1.7 : 1),
    drift: collasso ? 0 : deriva,
    col: M.col, col2: M.col2,
    alpha: collasso ? 1.0 : 0.85
  };
}

function lancia(collasso){
  const s = stato();
  volo = {t0: performance.now()/1000, p: paramsDaFormula(s.nit, collasso), dur: 0};
  volo.dur = volo.p.life + 0.6;
  const v = document.getElementById('verdict');
  const testo = collasso ? 'collasso' : (s.nit >= 0.999 ? 'pulita'
                : (s.nit >= 0.75 ? 'deriva' : 'inversione spontanea'));
  v.textContent = testo;
  v.style.color = collasso ? 'var(--bad)' : (s.nit>=0.999 ? 'var(--ok)' : (s.nit>=0.75?'var(--warn)':'var(--bad)'));
  v.classList.add('on'); ultimoVerdetto = performance.now();
}

/* ---------- input: tieni premuto ---------- */
const arena = document.getElementById('arena');
const ring = document.getElementById('ring'), arc = document.getElementById('arc');
function inizia(x,y){
  const s = stato();
  if (s.t <= 0.001) return;
  evocando = true; tEvoc = 0; tRichiesto = s.t; manaIniziale = serbatoio;
  ring.style.left = x+'px'; ring.style.top = y+'px';
  ring.style.color = 'var(--mat)'; ring.classList.add('on');
}
function ferma(completa){
  if (!evocando) return;
  evocando = false; ring.classList.remove('on');
  if (completa) lancia(false);
  else if (completa === false && serbatoio <= 0.01) lancia(true);
  else serbatoio = Math.min(SERBATOIO, manaIniziale);   // rilascio anticipato: mana restituito
}
arena.addEventListener('pointerdown', e => { e.preventDefault();
  const r = arena.getBoundingClientRect(); inizia(e.clientX-r.left, e.clientY-r.top);
  arena.setPointerCapture(e.pointerId); });
arena.addEventListener('pointerup',   () => ferma(null));
arena.addEventListener('pointercancel',() => ferma(null));

/* ---------- UI ---------- */
function costruisciUI(){
  const mats = document.getElementById('mats');
  for (const k of Object.keys(MATERIE)){
    const b = document.createElement('button');
    b.className='mat'; b.type='button'; b.textContent = MATERIE[k].nome;
    b.style.setProperty('--c', `var(--${k})`);
    b.setAttribute('aria-pressed', String(k===formula.materia));
    b.onclick = () => { formula.materia = k;
      document.documentElement.style.setProperty('--mat', `var(--${k})`);
      [...mats.children].forEach(c => c.setAttribute('aria-pressed', String(c===b)));
      aggiorna(); };
    mats.appendChild(b);
  }
  const box = document.getElementById('axes');
  for (const a of ASSI){
    const d = document.createElement('div'); d.className='ax';
    d.innerHTML = `<div class="axhead"><span class="axname"><b>${a.et}</b></span>
      <span class="axval" id="v-${a.k}">riposo</span></div>`;
    const r = document.createElement('input');
    r.type='range'; r.min = a.dir?0:-100; r.max=100; r.step=1; r.value=0;
    r.setAttribute('aria-label', a.et);
    r.oninput = () => { const val = +r.value/100;
      if (Math.abs(val) < 0.02 && !a.dir) delete formula.assi[a.k];
      else if (a.dir && val < 0.02) delete formula.assi[a.k];
      else formula.assi[a.k] = val;
      aggiorna(); };
    d.appendChild(r); box.appendChild(d);
  }
  // dose
  const d = document.createElement('div'); d.className='ax';
  d.innerHTML = `<div class="axhead"><span class="axname"><b>dose</b></span>
    <span class="axval set" id="v-dose">100%</span></div>`;
  const r = document.createElement('input');
  r.type='range'; r.min=25; r.max=200; r.step=5; r.value=100; r.setAttribute('aria-label','dose');
  r.oninput = () => { formula.dose = +r.value/100; aggiorna(); };
  d.appendChild(r); box.appendChild(d);
}

function aggiorna(){
  const s = stato();
  for (const a of ASSI){
    const el = document.getElementById('v-'+a.k);
    if (a.k in formula.assi){ el.textContent = (formula.assi[a.k]>=0?'+':'') + formula.assi[a.k].toFixed(2);
      el.classList.add('set'); }
    else { el.textContent = 'riposo ' + (a.dir ? '0' : (riposoDi(a.k)>=0?'+':'') + riposoDi(a.k).toFixed(1));
      el.classList.remove('set'); }
  }
  document.getElementById('v-dose').textContent = Math.round(formula.dose*100)+'%';
  document.getElementById('r-car').textContent = s.c.toFixed(1);
  document.getElementById('r-tem').textContent = s.t.toFixed(2)+' s';
  document.getElementById('r-man').textContent = s.m.toFixed(0) + (s.m > SERBATOIO ? ' ⚠' : '');
  document.getElementById('r-dos').textContent = Math.round(s.doseMax*100)+'%';
  const st = document.getElementById('state');
  st.textContent = s.m > SERBATOIO ? 'collasso: il serbatoio non basta' : s.deg;
  st.className = s.m > SERBATOIO ? 's-bad' : (s.deg==='pulita'?'s-ok':(s.deg==='deriva'?'s-warn':'s-bad'));
}

/* ---------- loop ---------- */
let last = performance.now(), acc = 0, frames = 0, msAvg = 0;
function frame(now){
  const dt = Math.min((now-last)/1000, 0.05); last = now;
  resize();

  if (evocando){
    tEvoc += dt;
    serbatoio = Math.max(0, serbatoio - DRENAGGIO*dt);
    const p = Math.min(tEvoc/tRichiesto, 1);
    arc.setAttribute('stroke-dashoffset', String(276.5*(1-p)));
    if (serbatoio <= 0 && p < 1){ evocando=false; ring.classList.remove('on'); lancia(true); }
    else if (p >= 1){ evocando=false; ring.classList.remove('on'); lancia(false); }
  } else {
    serbatoio = Math.min(SERBATOIO, serbatoio + RICARICA*dt);
  }
  const mb = document.getElementById('manabar');
  mb.style.width = (serbatoio/SERBATOIO*100)+'%';
  mb.classList.toggle('low', serbatoio < SERBATOIO*0.2);

  gl.clearColor(0.031,0.043,0.051,1); gl.clear(gl.COLOR_BUFFER_BIT);
  if (volo){
    const t = now/1000 - volo.t0;
    if (t > volo.dur) volo = null;
    else {
      const p = volo.p, u = prog.u;
      gl.useProgram(prog.p); gl.bindVertexArray(vao);
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);   // additivo, premultiplicato
      gl.disable(gl.DEPTH_TEST);
      gl.uniform1f(u.uT,t); gl.uniform1f(u.uLife,p.life);
      gl.uniform2f(u.uDir,p.dir[0],p.dir[1]); gl.uniform1f(u.uSpeed,p.speed);
      gl.uniform1f(u.uRadial,p.radial); gl.uniform1f(u.uMass,p.mass); gl.uniform1f(u.uRot,p.rot);
      gl.uniform1f(u.uNoise,p.noise); gl.uniform1f(u.uGrav,p.grav); gl.uniform1f(u.uBeat,p.beat);
      gl.uniform1f(u.uCoher,p.coher); gl.uniform1f(u.uSize,p.size);
      gl.uniform1f(u.uAspect,aspect); gl.uniform1f(u.uDrift,p.drift);
      gl.uniform2f(u.uOrigin,-0.72,-0.38);
      gl.uniform3f(u.uCol,p.col[0],p.col[1],p.col[2]);
      gl.uniform3f(u.uCol2,p.col2[0],p.col2[1],p.col2[2]);
      gl.uniform1f(u.uAlpha,p.alpha);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,N);
      gl.bindVertexArray(null);
    }
  }
  if (ultimoVerdetto && now - ultimoVerdetto > 1800){
    document.getElementById('verdict').classList.remove('on'); ultimoVerdetto = 0;
  }

  frames++; acc += dt;
  if (acc >= 0.5){
    msAvg = (acc/frames)*1000;
    document.getElementById('fps').textContent =
      msAvg.toFixed(1)+' ms  ·  '+Math.round(frames/acc)+' fps\n'+N+' particelle';
    frames = 0; acc = 0;
  }
  requestAnimationFrame(frame);
}

try {
  resize(); build(); costruisciUI(); aggiorna();
  document.documentElement.style.setProperty('--mat','var(--fuoco)');
  requestAnimationFrame(frame);
} catch(e){
  document.getElementById('hint').textContent = 'errore: ' + e.message;
  console.error(e);
}
</script>
</body>
