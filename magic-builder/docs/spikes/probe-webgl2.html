<script>
const out=[];
try{
  const {createContext,createProgram,setUniform,createMesh,setState,draw,BLEND,m4,perspective,lookAt,mul}=MR;
  const {gl,resize}=createContext(document.getElementById('c'));
  out.push('ctx:'+gl.getParameter(gl.VERSION));
  const asp=resize();
  const {program,uniforms}=createProgram(gl,
    `#version 300 es
     in vec3 position; in vec3 offset; uniform mat4 uVP; uniform float uT; out vec3 vC;
     void main(){ vec3 p=position+offset+vec3(0.,sin(uT+offset.x)*.3,0.);
       vC=.5+.5*normalize(offset+vec3(.001)); gl_Position=uVP*vec4(p,1.); }`,
    `#version 300 es
     precision highp float; in vec3 vC; out vec4 o; void main(){ o=vec4(vC,1.); }`);
  out.push('uniforms:'+Object.keys(uniforms).sort().join(','));
  const N=64, off=new Float32Array(N*3);
  for(let i=0;i<N;i++){off[i*3]=(i%8-3.5)*1.2; off[i*3+1]=0; off[i*3+2]=(Math.floor(i/8)-3.5)*1.2;}
  const mesh=createMesh(gl,{attributes:{
      position:{data:new Float32Array([-.4,-.4,0, .4,-.4,0, 0,.5,0]),size:3},
      offset:{data:off,size:3,divisor:1}},instanced:N});
  const vp=mul(m4(),perspective(m4(),1.0,asp,.1,100),lookAt(m4(),[0,6,12],[0,0,0],[0,1,0]));
  gl.clearColor(.04,.04,.07,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  setState(gl,{blend:BLEND.ADD,depthTest:true,depthWrite:false});
  gl.useProgram(program);
  setUniform(gl,uniforms,'uVP',vp); setUniform(gl,uniforms,'uT',1.2);
  draw(gl,mesh);
  const W=gl.drawingBufferWidth,H=gl.drawingBufferHeight;
  const buf=new Uint8Array(W*H*4);
  gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,buf);
  let drawn=0; const seen=new Set();
  for(let i=0;i<buf.length;i+=4){
    const r=buf[i],g=buf[i+1],b=buf[i+2];
    if(r===10&&g===10&&b===18) continue;
    drawn++; if(seen.size<5000) seen.add(r+','+g+','+b);
  }
  out.push('framebuffer:'+W+'x'+H);
  out.push('pixel non-sfondo:'+drawn+' ('+(100*drawn/(W*H)).toFixed(2)+'%)');
  out.push('colori distinti:'+seen.size);
  out.push('glError:'+gl.getError());
  out.push(drawn>1000&&seen.size>10?'GEOMETRIA RESA':'FALLITO');
}catch(e){out.push('ERRORE: '+e.message);}
document.title=out.join(' | ');
</script>
