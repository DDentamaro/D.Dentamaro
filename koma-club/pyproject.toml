[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koma-club"
version = "0.1.0"
description = "Prepara i post Instagram di Koma Club da immagini locali e calendario YAML"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.1",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
koma = "koma.cli:main"

[tool.setuptools]
packages = ["koma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
